
name: Deploy Weather Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create weather configuration
        env:
          API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::OPENWEATHER_API_KEY is missing or unavailable."
            exit 1
          fi
          printf 'const API_KEY = "%s";\n' "$API_KEY" > config.js
          echo "Weather configuration created successfully."

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
